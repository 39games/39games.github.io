<script>
const tagPriority = ["trap", "boom-bap", "chill", "dark", "moody", "gritty", "funky", "happy", "futuristic", "flute"];

const beats = [
    { title: "Awake",      file: "awake.mp3",       tags: ["boom-bap", "chill", "happy"],         icon: "chill.png",  price: "20", paypal: "" },
    { title: "Bit By bit", file: "bit by bit.mp3",  tags: ["boom-bap", "dark"],                   icon: "dark.png",   price: "20", paypal: "" },
    { title: "Guilt",      file: "guilt.mp3",        tags: ["boom-bap", "moody", "dark"],          icon: "dark.png",   price: "20", paypal: "" },
    { title: "How",        file: "how.mp3",          tags: ["boom-bap", "gritty", "dark"],         icon: "dark.png",   price: "20", paypal: "" },
    { title: "Hunter",     file: "hunter.mp3",       tags: ["boom-bap", "gritty", "dark"],         icon: "dark.png",   price: "20", paypal: "" },
    { title: "Late",       file: "late.mp3",         tags: ["boom-bap", "chill", "funky"],         icon: "chill.png",  price: "20", paypal: "" },
    { title: "Life",       file: "life.mp3",         tags: ["boom-bap", "chill", "happy"],         icon: "chill.png",  price: "20", paypal: "" },
    { title: "Rio",        file: "rio.mp3",          tags: ["boom-bap", "chill"],                  icon: "chill.png",  price: "20", paypal: "" },
    { title: "Calling",    file: "calling.mp3",      tags: ["trap", "chill", "futuristic"],        icon: "trap.png",   price: "20", paypal: "" },
    { title: "Seashell",   file: "seashell.mp3",     tags: ["trap", "chill"],                      icon: "trap.png",   price: "20", paypal: "" },
    { title: "Proud",      file: "proud.mp3",        tags: ["trap", "flute"],                      icon: "trap.png",   price: "20", paypal: "" },
    { title: "Bar",        file: "bar.mp3",          tags: ["boom-bap", "chill", "funky"],         icon: "chill.png",  price: "20", paypal: "" },
    { title: "Man",        file: "man.mp3",          tags: ["boom-bap", "chill", "happy"],         icon: "chill.png",  price: "20", paypal: "" },
    { title: "One Day",    file: "one day.mp3",      tags: ["boom-bap", "moody", "dark"],          icon: "dark.png",   price: "20", paypal: "" },
    { title: "Suit",       file: "suit.mp3",         tags: ["trap", "moody", "dark"],              icon: "trap.png",   price: "20", paypal: "" },
];

const defaultIcon = "beats/default.png";
const grid        = document.getElementById("beat-grid");
const searchInput = document.getElementById("search-beats");

function renderBeats(filter = "") {
    grid.innerHTML = "";
    const query = filter.toLowerCase();

    let filteredBeats = beats.filter(beat =>
        beat.title.toLowerCase().includes(query) ||
        beat.tags.join(" ").toLowerCase().includes(query)
    );

    filteredBeats.sort((a, b) => {
        const getPriorities = beat => beat.tags
            .map(tag => tagPriority.indexOf(tag))
            .filter(i => i !== -1)
            .sort((x, y) => x - y);
        const aPri = getPriorities(a);
        const bPri = getPriorities(b);
        for (let i = 0; i < Math.max(aPri.length, bPri.length); i++) {
            const av = aPri[i] ?? Infinity;
            const bv = bPri[i] ?? Infinity;
            if (av !== bv) return av - bv;
        }
        return a.title.localeCompare(b.title);
    });

    filteredBeats.forEach(beat => {
        const container  = document.createElement("div");
        container.className = "beat-card";
        container.setAttribute("role", "listitem");
        const iconPath   = beat.icon ? `beats/${beat.icon}` : defaultIcon;
        const audioPath  = `beats/${beat.file}`;
        container.innerHTML = `
            <div class="beat-img-container">
                <img class="beat" src="${iconPath}" alt="${beat.title} — ${beat.tags.join(', ')} beat" />
                <button class="play-overlay" aria-label="Play ${beat.title}"><i class="fas fa-play" aria-hidden="true"></i></button>
                <audio src="${audioPath}" preload="none"></audio>
            </div>
            <div class="game-info">
                <h3>${beat.title}</h3>
                <div class="beat-tags">
                    ${beat.tags.map(tag => `<span class="tag">${tag}</span>`).join("")}
                </div>
                <div class="timeline">
                    <span class="current-time">0:00</span>
                    <input type="range" class="progress" value="0" min="0" max="100" aria-label="Seek ${beat.title}">
                    <span class="duration">0:00</span>
                </div>
                <button class="btn buy-btn" data-title="${beat.title}" data-price="${beat.price}" data-paypal="${beat.paypal}" data-i18n="beats-buy">Buy Now</button>
            </div>
        `;
        grid.appendChild(container);
    });
}

searchInput.addEventListener("input", e => renderBeats(e.target.value));
</script>
